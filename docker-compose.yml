# ── LOCAL: levanta PostgreSQL + Backend + Frontend con un comando ──
# Uso

services:

  # ── Base de datos ──
  db:
    image: postgres:16-alpine
    container_name: maquillaje_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tienda_maquillaje}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script_db.txt:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tienda_maquillaje}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend FastAPI ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maquillaje_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tienda_maquillaje}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_cambiar_en_produccion_32chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
    volumes:
      - uploads_data:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Seed: usuarios iniciales (se ejecuta una sola vez) ──
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maquillaje_seed
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tienda_maquillaje}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_cambiar_en_produccion_32chars}
    command: python create_users.py
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  # ── Frontend React (con nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En local el browser accede a /api → nginx hace proxy a backend:8000
        VITE_API_URL: /api
    container_name: maquillaje_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
